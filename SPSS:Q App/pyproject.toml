[project]
name = "spssq"
version = "0.1.0"
description = "Survey analysis: crosstabs, RIM weighting, significance testing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "xlsxwriter>=3.2",
    "python-pptx>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "app.core"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
